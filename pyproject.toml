[project]
name = "brandpulse"
version = "0.1.0"
description = "BrandPulse — AI-powered customer voice intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "google-play-scraper>=1.2",
    "lingua-language-detector>=2.0",
    "emoji>=2.10",
    "scikit-learn>=1.4",
    "wordcloud>=1.9",
    "transformers>=4.40",
    "torch>=2.2",
    "sentencepiece>=0.2",
    "google-api-python-client>=2.100",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
